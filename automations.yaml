- id: '1587828654963'
  alias: Kodi
  description: Turn the lights off when Kodi plays
  trigger:
  - entity_id: media_player.kodi
    from: idle
    platform: state
    to: playing
  condition: []
  action:
  - data: {}
    entity_id: light.living_room
    service: light.turn_off
- id: '1587830481783'
  alias: Netflix
  description: Dim the lights when netflix/hulu/amazon prime plays
  trigger:
  - platform: state
    entity_id: media_player.lgtv
    attribute: source
    to:
    - Netflix
    - Hulu
    - Prime Video
  condition: []
  action:
  - data: {}
    entity_id: light.living_room
    service: light.turn_off
- alias: Nursery Low Temperature
  id: 4df6ec1850624467b23d601a5c548ff6
  triggers:
    - trigger: numeric_state
      entity_id: sensor.nursery_temperature
      below: 67
  actions:
    - action: notify.pushbullet
      data:
        title: Too Cold
        message: "The Temperature in the Nursery is {{ states('sensor.nursery_temperature') }} Degrees"

- alias: Nursery Hi Temperature
  id: 110151f29f2f4a049cd4a0c92c42d70f
  triggers:
    - trigger: numeric_state
      entity_id: sensor.nursery_temperature
      above: 73
  actions:
    - action: notify.pushbullet
      data:
        title: Too Hot
        message: "The Temperature in the Nursery is {{ states('sensor.nursery_temperature') }} Degrees"
