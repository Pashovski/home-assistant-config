- alias: Lights Off When We Leave
  trigger:
    platform: state
    entity_id: group.family
    to: not_home
  action:
  - service: light.turn_off
    entity_id:
    - light.bathroom_lights
    - light.dining_room_lights
    - light.master_bedroom_ceiling_fan_light
    - light.nursery_sconces
    - light.entryway_light
    - light.0x0017880108197b79_light
  - service: switch.turn_off
    entity_id:
    - switch.living_room_3
    - switch.bedroom_2
    - switch.bedroom_1
  id: 4e160fc575e44f6c97e227dd3e7b4a2c
- alias: Lights on When We Come Back
  trigger:
    platform: state
    entity_id: group.family
    to: home
  action:
  - service: light.turn_on
    entity_id:
    - light.bathroom_lights
    - light.dining_room_lights
    - light.master_bedroom_ceiling_fan_light
    - light.nursery_sconces
    - light.entryway_light
    - light.0x0017880108197b79_light
  - service: switch.turn_on
    entity_id:
    - switch.living_room_3
    - switch.bedroom_2
    - switch.bedroom_1
  id: 07d080f92875429e9f8bc1110c11b2fe
- alias: Boolean Test 3
  trigger:
    platform: state
    entity_id: binary_sensor.mailbox_contact
    to: 'on'
  action:
    service: input_boolean.toggle
    entity_id: input_boolean.motion_detected
  id: e22d6278271047e5afe1a1f628f47890
- alias: Reset Sensor At Midnight
  trigger:
  - platform: time
    at: 00:00:00
  action:
  - service: input_boolean.turn_off
    entity_id: input_boolean.motion_detected
  id: f1538a2367274210a5ce29015ad28eea
- alias: Dishwasher State - Start
  trigger:
    platform: numeric_state
    entity_id: sensor.dishwasher_watts
    above: 5
    for:
      seconds: 4
  condition:
    condition: template
    value_template: '{{ states.sensor.dishwasher_state.state != ''Washing'' }}'
  action:
  - service: mqtt.publish
    data:
      topic: hass/state/Dishwasher
      payload: Washing
      retain: 'true'
  id: 3b1da440d6af41e58eaae4c3a24a1d74
- alias: Dishwasher State - Idle
  trigger:
    platform: numeric_state
    entity_id: sensor.dishwasher_watts
    below: 5
    for:
      minutes: 5
  action:
  - service: mqtt.publish
    data:
      topic: hass/state/Dishwasher
      payload: Idle
      retain: 'true'
  id: a6230cc1111a498ab3656ca4dedc76c9
- alias: Washer State - Start
  trigger:
    platform: numeric_state
    entity_id: sensor.washer_watts
    above: 5
    for:
      seconds: 4
  condition:
    condition: template
    value_template: '{{ states.sensor.washer_state.state != ''Washing'' }}'
  action:
  - service: mqtt.publish
    data:
      topic: hass/state/washer
      payload: Washing
      retain: 'true'
  id: c011de34442241f39454995237ec3c19
- alias: Washer State - Idle
  trigger:
    platform: numeric_state
    entity_id: sensor.washer_watts
    below: 5
    for:
      minutes: 5
  action:
  - service: mqtt.publish
    data:
      topic: hass/state/washer
      payload: Idle
      retain: 'true'
  id: 04b060g79675429e9f8bj1110t11f2sg
- alias: Washer Finished
  trigger:
    platform: state
    entity_id: sensor.washer_state
    from: Washing
    to: Idle
  condition:
  - condition: state
    entity_id: input_boolean.washer_clean
    state: 'on'
  action:
  - service: input_boolean.turn_off
    entity_id: input_boolean.washer_clean
  - service: input_boolean.turn_on
    entity_id: input_boolean.laundry_ready_to_move
  - service: notify.alexa_media_everywhere
    data:
      message: The clothes are ready to be moved to the dryer
      data:
        type: announce
        method: tts
  id: 62fd808d8971417eaa6a3be0373facfc
